schema_version: 1
name: office-convert
version: 1.0.0
description: 隔离配置的旧 Office 文档转 OOXML 与本机引擎检查
category: office
core_compatibility: ">=1.0.16,<2.0"
capabilities:
  concurrency: true
  network: false
  filesystem: output-only
  resources: [libreoffice-headless]
entry: src.main:Plugin
commands:
  - name: office.convert
    description: 将真实 OLE 的 xls/doc/ppt 转为 xlsx/docx/pptx，逐项报告结果
    input_schema: schemas/office.convert.json
  - name: office.inspect
    description: 只读检查 LibreOffice 引擎及版本，不转换文档
    input_schema: schemas/office.inspect.json
