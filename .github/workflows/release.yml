name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade .
      - name: Verify runtime
        run: python -m unittest discover -s tests -v
      - name: Build distribution and plugin archives
        run: |
          python -m pip install --upgrade build
          python -m build
          mkdir -p plugin-dist
          python -m testbox.cli plugin package plugins/data-generator --output plugin-dist/data-generator-1.0.0.zip
          python -m testbox.cli plugin package plugins/sql-parser --output plugin-dist/sql-parser-1.0.0.zip
          python -m testbox.cli plugin package plugins/evidence-tool --output plugin-dist/evidence-tool-1.0.0.zip
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testbox-release
          path: |
            dist/*
            plugin-dist/*
  windows:
    runs-on: windows-latest
    env:
      # Keep Python subprocess pipes UTF-8 on Windows; plugin data and reports
      # legitimately contain Chinese text.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade .
      - name: Verify runtime
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Smoke test executable
        shell: pwsh
        run: |
          ./dist/TestBox.exe plugin list
          ./dist/TestBox.exe run data.mock --count 2 --format csv --seed 10001
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $workspaceRoot = Join-Path $env:LOCALAPPDATA "TestBox\workspace"
            $latestTask = Get-ChildItem -Path $workspaceRoot -Directory -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime | Select-Object -Last 1
            if ($latestTask) {
              Write-Host "--- TestBox task result: $($latestTask.FullName) ---"
              Get-Content (Join-Path $latestTask.FullName "result.json") -Raw -ErrorAction SilentlyContinue
              Write-Host "--- TestBox Host log ---"
              Get-Content (Join-Path $latestTask.FullName "logs\task.log") -Raw -ErrorAction SilentlyContinue
            }
            exit $exitCode
          }
      - name: Upload Windows applications
        uses: actions/upload-artifact@v4
        with:
          name: testbox-windows-applications
          path: |
            dist/TestBox.exe
            dist/TestBox-GUI.exe
          if-no-files-found: error
  release:
    needs: [package, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Python and plugin artifacts
        uses: actions/download-artifact@v4
        with:
          name: testbox-release
          path: release-assets
      - name: Download Windows applications
        uses: actions/download-artifact@v4
        with:
          name: testbox-windows-applications
          path: release-assets
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
