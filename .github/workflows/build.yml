name: Build and release

on:
  # Formal releases are created only from matching semantic-version tags.
  # Normal pushes to main/master still run validation/build jobs only.
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Build jobs only need to read repository contents. The release job below
# elevates its permission explicitly so pull requests can never publish.
permissions:
  contents: read

jobs:
  package:
    name: Build Python distribution and plugin packages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Resolve release version
        shell: bash
        run: |
          declared_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          version="$declared_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$declared_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $declared_version" >&2
              exit 1
            fi
            version="$tag_version"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build distribution and plugin archives
        shell: bash
        run: |
          python -m pip install --upgrade build
          python -m build
          mkdir -p plugin-dist
          python -m testbox.cli plugin package plugins/data-generator --output "plugin-dist/data-generator-${RELEASE_VERSION}.zip"
          python -m testbox.cli plugin package plugins/sql-parser --output "plugin-dist/sql-parser-${RELEASE_VERSION}.zip"
          python -m testbox.cli plugin package plugins/sql-select --output "plugin-dist/sql-select-${RELEASE_VERSION}.zip"
          python -m testbox.cli plugin package plugins/evidence-tool --output "plugin-dist/evidence-tool-${RELEASE_VERSION}.zip"
      - name: Upload Python and plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testbox-release
          path: |
            dist/*
            plugin-dist/*
          if-no-files-found: error

  windows:
    name: Build Windows applications
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      # Keep Python subprocess pipes UTF-8 on Windows; plugin data and reports
      # legitimately contain Chinese text.
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Resolve release version
        shell: pwsh
        run: |
          $declaredVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $declaredVersion) {
              throw "Tag $env:GITHUB_REF_NAME does not match pyproject.toml version $declaredVersion"
            }
            $releaseVersion = $tagVersion
          } else {
            $releaseVersion = $declaredVersion
          }
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create Windows executables
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Smoke test executable
        shell: pwsh
        run: |
          ./dist/windows/TestBox/TestBox.exe plugin list
          ./dist/windows/TestBox/TestBox.exe run data.mock --set count=2 --set format=csv --set seed=10001 --set 'fields=[{"name":"value","generator":"constant","options":{"value":"TEST DATA ONLY"}}]'
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $workspaceRoot = Join-Path $env:LOCALAPPDATA "TestBox\workspace"
            $latestTask = Get-ChildItem -Path $workspaceRoot -Directory -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime | Select-Object -Last 1
            if ($latestTask) {
              Write-Host "--- TestBox task result: $($latestTask.FullName) ---"
              Get-Content (Join-Path $latestTask.FullName "result.json") -Raw -ErrorAction SilentlyContinue
              Write-Host "--- TestBox Host log ---"
              Get-Content (Join-Path $latestTask.FullName "logs\task.log") -Raw -ErrorAction SilentlyContinue
            }
            exit $exitCode
          }
      - name: Resolve previous release manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          $previous = $releases |
            Where-Object { $_.tag_name -match '^v[0-9]+\.[0-9]+\.[0-9]+$' -and $_.tag_name -ne $env:GITHUB_REF_NAME } |
            ForEach-Object {
              try { [pscustomobject]@{ Release = $_; Version = [version]$_.tag_name.Substring(1) } } catch {}
            } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if ($previous) {
            $asset = $previous.Release.assets | Where-Object { $_.name -eq 'update-manifest.json' } | Select-Object -First 1
            if ($asset) {
              Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\previous-update-manifest.json"
              Write-Host "Using previous release manifest: $($previous.Release.tag_name)"
            }
          }
      - name: Create Windows update package and portable archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $previousArgs = @()
          $previousManifest = "$env:RUNNER_TEMP\previous-update-manifest.json"
          if (Test-Path $previousManifest) {
            $previousArgs = @('--previous-manifest', $previousManifest)
          }
          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          python scripts/build_update_package.py --root dist/windows --version $env:RELEASE_VERSION --output "dist/TestBox-update-v$env:RELEASE_VERSION.zip" --manifest dist/windows/update-manifest.json --package-base-url $baseUrl @previousArgs
          Compress-Archive -Path dist/windows/* -DestinationPath "dist/TestBox-v$env:RELEASE_VERSION-windows.zip" -CompressionLevel Optimal
      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) was not found' }
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" installer/TestBox.iss
      - name: Upload Windows applications
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: testbox-windows-applications
          path: |
            dist/TestBox-Setup-v*.exe
            dist/TestBox-v*-windows.zip
            dist/TestBox-update-v*.zip
            dist/windows/update-manifest.json
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [package, windows]
    # Only matching vX.Y.Z tag pushes publish immutable formal releases.
    # Normal pushes to main/master never create or overwrite a release.
    if: >-
      needs.package.result == 'success' &&
      needs.windows.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: testbox-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # Checkout must happen before downloading artifacts. checkout cleans the
      # working tree by default, which would otherwise delete release-assets.
      - name: Check out source for release metadata
        uses: actions/checkout@v4
      - name: Set up Python for release metadata
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          declared_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="$declared_version"
          fi
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
      - name: Download Python and plugin artifacts
        uses: actions/download-artifact@v4
        with:
          name: testbox-release
          path: release-assets
      - name: Download Windows applications
        uses: actions/download-artifact@v4
        with:
          name: testbox-windows-applications
          path: release-assets
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -print
          test -n "$(find release-assets -type f -print -quit)"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TestBox ${{ github.ref_name }}
          body: |
            TestBox version: v${{ steps.version.outputs.release_version }}
            Commit: ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release-assets/**/*
          overwrite_files: true
          fail_on_unmatched_files: true
