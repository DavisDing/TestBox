name: Build and release

on:
  # Every push to the release branches creates a formal patch release.
  # Version tags remain supported for an explicit/manual release retry.
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare automatic version and release
    runs-on: ubuntu-latest
    # Serialize version/tag allocation so two close pushes cannot choose the
    # same patch number.
    concurrency:
      group: testbox-version-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      publish_release: ${{ steps.release.outputs.publish_release }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          declared_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          publish_release=false
          release_tag=""

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$declared_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $declared_version" >&2
              exit 1
            fi
            release_version="$tag_version"
            release_tag="$GITHUB_REF_NAME"
            publish_release=true
            checkout_ref="$GITHUB_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/heads/master ) ]]; then
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1 || true)"
            release_version="$(python scripts/release_version.py resolve --declared-version "$declared_version" --latest-tag "$latest_tag")"
            python scripts/release_version.py sync --version "$release_version"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git diff --quiet -- pyproject.toml testbox/__init__.py installer/TestBox.iss installer/TestBoxCLI.iss installer/TestBoxUpdate.iss installer/TestBoxCLIUpdate.iss; then
              git add pyproject.toml testbox/__init__.py installer/TestBox.iss installer/TestBoxCLI.iss installer/TestBoxUpdate.iss installer/TestBoxCLIUpdate.iss
              git commit -m "chore: bump version to $release_version [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
            checkout_ref="$(git rev-parse HEAD)"
            release_tag="v$release_version"
            publish_release=true
            if git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
              existing_target="$(git rev-list -n 1 "$release_tag")"
              if [[ "$existing_target" != "$checkout_ref" ]]; then
                echo "Release tag $release_tag already points to $existing_target, expected $checkout_ref" >&2
                exit 1
              fi
            else
              git tag -a "$release_tag" "$checkout_ref" -m "TestBox $release_tag"
              git push origin "$release_tag"
            fi
          else
            # PRs and manually dispatched verification runs build the checked
            # out revision but never push a version commit, tag, or Release.
            release_version="$declared_version"
            checkout_ref="$GITHUB_SHA"
          fi

          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"

  package:
    needs: [prepare-release]
    name: Build Python distribution and plugin packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade ".[evidence]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Resolve release version
        shell: bash
        run: echo "RELEASE_VERSION=${{ needs.prepare-release.outputs.version }}" >> "$GITHUB_ENV"
      - name: Build distribution and plugin archives
        shell: bash
        run: |
          python -m pip install --upgrade build
          python -m build
          mkdir -p plugin-dist
          python -m testbox.cli plugin package plugins/data-generator --output "plugin-dist/data-generator-${RELEASE_VERSION}.zip"
          python -m testbox.cli plugin package plugins/sql-parser --output "plugin-dist/sql-parser-${RELEASE_VERSION}.zip"
          python -m testbox.cli plugin package plugins/sql-select --output "plugin-dist/sql-select-${RELEASE_VERSION}.zip"
          python -m testbox.cli plugin package plugins/evidence-tool --output "plugin-dist/evidence-tool-${RELEASE_VERSION}.zip"
      - name: Upload Python and plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testbox-release
          path: |
            dist/*
            plugin-dist/*
          if-no-files-found: error

  windows:
    needs: [prepare-release]
    name: Build Windows installers
    runs-on: windows-latest
    env:
      # Keep Python subprocess pipes UTF-8 on Windows; plugin data and reports
      # legitimately contain Chinese text.
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade ".[desktop,evidence,windows-build]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Resolve release version
        shell: pwsh
        run: |
          "RELEASE_VERSION=${{ needs.prepare-release.outputs.version }}" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create Windows executables
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Smoke test CLI and GUI executables
        shell: pwsh
        run: |
          $cliExe = Join-Path $env:GITHUB_WORKSPACE "dist\windows\cli\TestBox\TestBox.exe"
          $guiExe = Join-Path $env:GITHUB_WORKSPACE "dist\windows\gui\TestBox-GUI\TestBox-GUI.exe"
          foreach ($exe in @($cliExe, $guiExe)) {
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              Write-Host "--- Windows build output ---"
              Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "dist\windows") -Recurse -File | Select-Object -ExpandProperty FullName
              throw "TestBox executable was not created: $exe"
            }
          }
          & $cliExe plugin list
          if ($LASTEXITCODE -ne 0) { throw "TestBox CLI plugin list failed with exit code $LASTEXITCODE" }
          & $cliExe run data.mock --set count=2 --set format=csv --set seed=10001 --set 'fields=[{"name":"value","generator":"constant","options":{"value":"TEST DATA ONLY"}}]'
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $workspaceRoot = Join-Path $env:LOCALAPPDATA "TestBox\workspace"
            $latestTask = Get-ChildItem -Path $workspaceRoot -Directory -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime | Select-Object -Last 1
            if ($latestTask) {
              Write-Host "--- TestBox task result: $($latestTask.FullName) ---"
              Get-Content (Join-Path $latestTask.FullName "result.json") -Raw -ErrorAction SilentlyContinue
              Write-Host "--- TestBox Host log ---"
              Get-Content (Join-Path $latestTask.FullName "logs\task.log") -Raw -ErrorAction SilentlyContinue
            }
            exit $exitCode
          }
          # Test the same GUI executable in headless Host mode. Because this
          # is a windowed executable on Windows, the request/result use files
          # rather than stdout/stderr pipes.
          $guiBundle = Split-Path -Parent $guiExe
          $guiWorkspace = Join-Path $env:RUNNER_TEMP "testbox-gui-host"
          $guiRequestPath = Join-Path $guiWorkspace "request.json"
          $guiResponsePath = Join-Path $guiWorkspace "response.json"
          New-Item -ItemType Directory -Force -Path (Join-Path $guiWorkspace "input"), (Join-Path $guiWorkspace "output"), (Join-Path $guiWorkspace "logs") | Out-Null
          $guiRequest = @{
            protocol_version = 1
            task_id = "gui-smoke"
            command = "data.mock"
            entry = "src.main:Plugin"
            plugin_path = (Join-Path $guiBundle "_internal\plugins\data-generator")
            workspace = $guiWorkspace
            params = @{ count = 1; format = "csv"; seed = 10001; fields = @(@{ name = "value"; generator = "constant"; options = @{ value = "TEST DATA ONLY" } }) }
            config = @{}
          } | ConvertTo-Json -Depth 10 -Compress
          [System.IO.File]::WriteAllText($guiRequestPath, $guiRequest, [System.Text.UTF8Encoding]::new($false))
          & $guiExe --plugin-host --request-file $guiRequestPath --response-file $guiResponsePath
          if ($LASTEXITCODE -ne 0) { throw "TestBox GUI plugin Host failed with exit code $LASTEXITCODE" }
          $guiEvent = Get-Content $guiResponsePath -Raw | ConvertFrom-Json
          if ($guiEvent.event -ne "result" -or $guiEvent.result.status -ne "success") {
            throw "TestBox GUI plugin Host returned an unexpected result: $(Get-Content $guiResponsePath -Raw)"
          }
      - name: Resolve previous release manifests
        if: needs.prepare-release.outputs.publish_release == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          $previous = $releases |
            Where-Object { $_.tag_name -match '^v[0-9]+\.[0-9]+\.[0-9]+$' -and $_.tag_name -ne '${{ needs.prepare-release.outputs.release_tag }}' } |
            ForEach-Object {
              try { [pscustomobject]@{ Release = $_; Version = [version]$_.tag_name.Substring(1) } } catch {}
            } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if ($previous) {
            foreach ($component in @('CLI', 'GUI')) {
              $assetName = "TestBox-$component-update-manifest.json"
              $asset = $previous.Release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
              if ($asset) {
                Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\previous-$($component.ToLower())-update-manifest.json"
                Write-Host "Using previous $component release manifest: $($previous.Release.tag_name)"
              }
            }
          }
      - name: Create component update packages
        shell: pwsh
        run: |
          $packageBaseUrlArgs = @()
          if ('${{ needs.prepare-release.outputs.publish_release }}' -eq 'true') {
            $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/${{ needs.prepare-release.outputs.release_tag }}"
            $packageBaseUrlArgs = @('--package-base-url', $baseUrl)
          }
          foreach ($component in @('cli', 'gui')) {
            $title = $component.ToUpperInvariant()
            $previousArgs = @()
            $previousManifest = "$env:RUNNER_TEMP\previous-$component-update-manifest.json"
            if (Test-Path $previousManifest) {
              $previousArgs = @('--previous-manifest', $previousManifest)
            }
            $package = "dist/TestBox-$title-update-v$env:RELEASE_VERSION.zip"
            $manifest = "dist/windows/$component/update-manifest.json"
            python scripts/build_update_package.py --component $component --root "dist/windows/$component" --version $env:RELEASE_VERSION --output $package --manifest $manifest @packageBaseUrlArgs @previousArgs
            if ($LASTEXITCODE -ne 0) { throw "Failed to create $title update package" }
            Copy-Item $manifest "dist/TestBox-$title-update-manifest.json"
          }
      - name: Build component installation and incremental setup programs
        shell: pwsh
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) was not found' }
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" installer/TestBoxCLI.iss
          if ($LASTEXITCODE -ne 0) { throw "CLI installer build failed with exit code $LASTEXITCODE" }
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" "/DUpdatePackage=TestBox-CLI-update-v$env:RELEASE_VERSION.zip" installer/TestBoxCLIUpdate.iss
          if ($LASTEXITCODE -ne 0) { throw "CLI incremental setup build failed with exit code $LASTEXITCODE" }
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" installer/TestBox.iss
          if ($LASTEXITCODE -ne 0) { throw "GUI installer build failed with exit code $LASTEXITCODE" }
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" "/DUpdatePackage=TestBox-GUI-update-v$env:RELEASE_VERSION.zip" installer/TestBoxUpdate.iss
          if ($LASTEXITCODE -ne 0) { throw "GUI incremental setup build failed with exit code $LASTEXITCODE" }
          $expected = @(
            "dist\TestBox-CLI-Install-v$env:RELEASE_VERSION.exe",
            "dist\TestBox-CLI-Setup-v$env:RELEASE_VERSION.exe",
            "dist\TestBox-CLI-update-v$env:RELEASE_VERSION.zip",
            "dist\TestBox-CLI-update-manifest.json",
            "dist\TestBox-GUI-Install-v$env:RELEASE_VERSION.exe",
            "dist\TestBox-GUI-Setup-v$env:RELEASE_VERSION.exe",
            "dist\TestBox-GUI-update-v$env:RELEASE_VERSION.zip",
            "dist\TestBox-GUI-update-manifest.json"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Expected Windows release asset was not created: $path" }
          }
      - name: Upload Windows release artifacts
        if: needs.prepare-release.outputs.publish_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testbox-windows-applications
          path: |
            dist/TestBox-CLI-Install-v*.exe
            dist/TestBox-CLI-Setup-v*.exe
            dist/TestBox-CLI-update-v*.zip
            dist/TestBox-CLI-update-manifest.json
            dist/TestBox-GUI-Install-v*.exe
            dist/TestBox-GUI-Setup-v*.exe
            dist/TestBox-GUI-update-v*.zip
            dist/TestBox-GUI-update-manifest.json
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare-release, package, windows]
    if: >-
      needs.prepare-release.outputs.publish_release == 'true' &&
      needs.package.result == 'success' &&
      needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: testbox-release-${{ needs.prepare-release.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Check out source for release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
      - name: Download Python and plugin artifacts
        uses: actions/download-artifact@v4
        with:
          name: testbox-release
          path: release-assets
      - name: Download Windows applications
        uses: actions/download-artifact@v4
        with:
          name: testbox-windows-applications
          path: release-assets
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -print
          test -n "$(find release-assets -type f -print -quit)"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: TestBox ${{ needs.prepare-release.outputs.release_tag }}
          body: |
            TestBox version: v${{ needs.prepare-release.outputs.version }}
            Commit: ${{ needs.prepare-release.outputs.checkout_ref }}

            Windows assets:
            - TestBox-CLI-Install-v${{ needs.prepare-release.outputs.version }}.exe: CLI full installation program
            - TestBox-CLI-Setup-v${{ needs.prepare-release.outputs.version }}.exe: CLI incremental setup program
            - TestBox-CLI-update-v${{ needs.prepare-release.outputs.version }}.zip: CLI updater payload
            - TestBox-GUI-Install-v${{ needs.prepare-release.outputs.version }}.exe: GUI full installation program
            - TestBox-GUI-Setup-v${{ needs.prepare-release.outputs.version }}.exe: GUI incremental setup program
            - TestBox-GUI-update-v${{ needs.prepare-release.outputs.version }}.zip: GUI updater payload
          target_commitish: ${{ needs.prepare-release.outputs.checkout_ref }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release-assets/**/*
          overwrite_files: true
          fail_on_unmatched_files: true
