[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testbox"
version = "1.0.23"
description = "Local, plugin-based test productivity toolbox"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
testbox = "testbox.cli:main"
testbox-gui = "testbox.gui:main"

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
evidence = ["openpyxl>=3.1,<3.2", "python-docx>=1.1,<1.3", "Pillow>=10,<13"]
windows-build = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
include = ["testbox*"]

[tool.setuptools.cmdclass]
build_py = "testbox_build.BundledBuildPy"

[tool.setuptools.package-data]
testbox = ["assets/*.ico", "assets/*.svg"]
