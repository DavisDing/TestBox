[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testbox"
version = "1.0.2"
description = "Local, plugin-based test productivity toolbox"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "pydantic>=2.0", "PyYAML>=6.0", "loguru>=0.7", "openpyxl>=3.1,<3.2", "python-docx>=1.1,<1.3", "Pillow>=10,<13"]

[project.scripts]
testbox = "testbox.cli:main"
testbox-gui = "testbox.gui:main"

[project.optional-dependencies]
windows-build = ["pyinstaller>=6.0"]
desktop = ["PySide6>=6.7"]

[tool.setuptools.packages.find]
include = ["testbox*"]
